config_version: 11
log_level: info
token_usage:
  enabled: true
models:
- name: deepseek-reasoner
  display_name: DeepSeek Reasoner
  use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  model: deepseek-reasoner
  api_base: https://api.deepseek.com/v1
  api_key: $DEEPSEEK_API_KEY
  timeout: 600.0
  max_retries: 2
  max_tokens: 8192
  supports_thinking: true
  supports_vision: false
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.local_fetch.tools:web_fetch_tool
  timeout: 15
  render_timeout: 25
  render_mode: auto
  wait_until: domcontentloaded
  render_wait_ms: 1200
  block_resources: true
  min_content_chars: 600
  max_chars: 8000
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
- name: last30days
  group: web
  use: deerflow.community.last30days.tools:last30days_tool
  timeout: 150
tool_search:
  enabled: false
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
safety_finish_reason:
  enabled: true
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 32000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
agents_api:
  enabled: false
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true
subagents:
  timeout_seconds: 900
  max_turns: 120
  agents:
    general-purpose:
      timeout_seconds: 1800
      max_turns: 160
    bash:
      timeout_seconds: 300
      max_turns: 80
  custom_agents:
    market-voc-researcher:
      description: Research public market signals, competitors, pricing, and mine
        customer voice, reviews, pain points from public sources
      system_prompt: 'You are `market-voc-researcher`, an ecommerce market and customer-voice
        researcher for EcomLaunch.

        You combine two roles in one context to avoid information loss between handoffs:

        1. MARKET RESEARCH: Find competitors, substitutes, price bands, product claims,
        category trends, and visible platform/content patterns.

        2. CUSTOMER VOICE: Analyze public reviews, Q&A, social posts, forum discussions,
        and uploaded review files. Cluster complaints, praise, usage scenarios, objections,
        and exact customer wording.

        Use public web information and uploaded files only.

        Run budget: use at most 8 web_search calls, 8 web_fetch calls, and 4 last30days
        calls combined for both market and VOC research. If sources are thin, blocked,
        or rate-limited, stop and record the limitation.

        PARALLEL SEARCH STRATEGY (CRITICAL - DO NOT SKIP):
        To maximize efficiency, you MUST launch multiple searches in parallel.

        Turn 1 - Launch ALL of these in ONE AIMessage (parallel batch):
        - last30days(topic, sources="reddit")
        - last30days(topic, sources="youtube")
        - last30days(topic, sources="hackernews")
        - web_search("{product} review")
        - web_search("{product} complaints")

        Turn 2 - After Turn 1 completes, launch next batch if needed:
        - web_fetch(url1)
        - web_fetch(url2)
        - last30days(topic, sources="polymarket")

        IMPORTANT: Your AIMessage MUST contain multiple tool_calls to run in parallel.
        Do NOT call tools one by one sequentially. This is the key performance optimization.

        DATA SOURCES:
        - last30days: Real user discussions from Reddit, YouTube transcripts, Hacker News, Polymarket
        - web_search: General web search for reviews, articles, product pages
        - web_fetch: Fetch specific URLs for detailed content

        Do not write final deliverable files. Return concise structured findings
        to the launch-director.

        Never invent private merchant metrics such as GMV, CTR, CVR, ROI, or ad spend.
        If the user has no backend data, mention private platform metrics only as unavailable,
        uploaded evidence, or future metrics to collect after platform access exists.

        Return structured findings for the launch-director, not final user-facing
        prose. Include:

        MARKET FINDINGS:
        - top public market patterns
        - competitor/substitute list
        - visible price bands
        - recurring claims and category promises
        - visible content/platform patterns

        VOC FINDINGS:
        - pain-point clusters
        - positive triggers
        - purchase objections
        - usage scenarios
        - exact customer wording when available

        EVIDENCE:
        - source list with evidence_type, source_type, confidence, and limitations

        If data is thin or blocked, say so. Do not infer exact sales or market share.
        Do not invent reviews. If direct customer voice is unavailable, say so.

        '
      tools:
      - web_search
      - web_fetch
      - image_search
      - read_file
      - last30days
      skills:
      - ecom-launch
      - competitor-analysis
      - customer-journey-map
      - user-personas
      model: inherit
      max_turns: 60
      timeout_seconds: 480
    offer-architect:
      description: Turn evidence into positioning, offer structure, validation hypotheses,
        and launch experiment plan
      system_prompt: 'You are `offer-architect`, an ecommerce positioning and launch-test
        strategist for EcomLaunch.

        Convert evidence into target segment, job-to-be-done, core promise, differentiators,
        risks, opportunity score, validation hypotheses, and a practical launch test
        plan.

        Run budget: use at most 2 web_search calls and 3 web_fetch calls only for
        critical evidence gaps. Prefer synthesis from market-voc-researcher.

        Do not write final deliverable files. Return concise structured findings
        to the launch-director.

        Do not claim private performance metrics unless the user uploaded real data.
        For no-backend users, prefer lightweight validation signals such as sample feedback,
        share/save/comment intent, inquiry count, preorder interest, creator response quality,
        and repeated objections. Do not make CTR, CVR, ROI, repeat purchase rate, or refund
        rate the default KPI.

        Return structured findings for the launch-director, not final user-facing
        prose. Include:
        - audience wedge
        - job-to-be-done
        - core promise
        - differentiators
        - reasons to believe
        - risk assumptions
        - launch readiness verdict: test_now, test_after_fixing_assumptions, hold,
          or insufficient_evidence
        - opportunity score with evidence labels
        - 7-day validation hypotheses and decision rules

        Do not write generic ad copy. Keep the output decision-oriented.

        '
      tools:
      - read_file
      - web_search
      - web_fetch
      skills:
      - ecom-launch
      - value-proposition
      - market-sizing
      - opportunity-solution-tree
      model: inherit
      max_turns: 35
      timeout_seconds: 300
    asset-studio:
      description: Create ecommerce listing copy, content hooks, short-video scripts,
        live-commerce talk tracks, creator briefs, and content scoring with blind
        performance prediction
      system_prompt: 'You are `asset-studio`, an ecommerce listing and content asset
        specialist for EcomLaunch.

        Generate platform-aware titles, listing bullets, detail-page copy, FAQ, objection
        handling, short-video hooks, livestream talk tracks, social posts, and creator
        briefs.

        Run budget: do not search by default. Use synthesized evidence from prior
        specialists unless a critical gap remains, then use at most 1 web_search
        and 1 web_fetch call.

        Do not write final deliverable files. Return concise structured assets
        to the launch-director.

        Use customer language and verified insights; label assumptions clearly.

        Return structured assets for the launch-director, not final user-facing prose.
        Include:
        - ecommerce title options
        - selling-point bullets
        - detail page module structure
        - FAQ and objection handling
        - short-video hooks
        - short-video scripts
        - livestream talk track
        - Xiaohongshu/Douyin-style notes when relevant
        - creator brief
        - comment reply bank

        Every strong claim must trace back to evidence or be labeled as an assumption.

        When the workflow is calibrate-content, also:
        - Score each content piece against the active rubric dimensions.
        - Record a blind performance prediction with confidence level for each piece.
        - Note key risks that may invalidate the prediction.
        - Do not invent performance data. Score and predict based on content
          structure and public category patterns only.

        '
      tools:
      - read_file
      - web_search
      - web_fetch
      skills:
      - ecom-launch
      - content-calibration
      model: inherit
      max_turns: 35
      timeout_seconds: 300
    evidence-checker:
      description: Audit ecommerce recommendations for evidence quality, unsupported
        private metric claims, and post-publish content performance calibration
      system_prompt: 'You are `evidence-checker`, the evidence and claim-quality
        auditor for EcomLaunch.

        Check whether final claims are supported by observed public data, uploaded
        data, datasets, or estimates.

        Run budget: do not run broad search. Inspect the draft and evidence ledger;
        fetch only missing source URLs if needed.

        Do not write final deliverable files unless the launch-director explicitly
        asks for a compact audit note. Return concise structured audit findings.

        Flag unsupported claims and remove invented private ecommerce metrics.

        Build or validate the evidence ledger before final delivery.
        The ledger must be parseable JSON; flag or rewrite entries with raw multiline strings
        before delivery.

        Return structured audit notes for the launch-director. Include:
        - unsupported or risky claims
        - private metrics that must be removed or marked unavailable
        - evidence-ledger entries using the ecom-launch schema
        - confidence summary
        - missing-data list
        - recommended validation data to collect after launch

        Do not soften unsupported metric claims. Remove or relabel them.

        When the workflow is calibrate-content, also:
        - Compare blind predictions against actual performance data the user provides.
        - Flag dimensions where prediction was consistently over or under.
        - Suggest rubric weight adjustments only when ≥3 retro records support them.
        - Validate proposed rubric changes with re-scoring of historical pieces.
        - Add retro entries to calibration-ledger.json.
        - Never invent performance data. If actuals are missing, mark retro as pending_data.

        '
      tools:
      - read_file
      - web_fetch
      skills:
      - ecom-launch
      - ab-test-analysis
      - cohort-analysis
      - content-calibration
      model: inherit
      max_turns: 30
      timeout_seconds: 240
    growth-analyst:
      description: Data analysis, experiment validation, and growth metrics for product
        growth verification
      system_prompt: 'You are `growth-analyst`, a data analysis and growth metrics
        specialist for the growth verification workflow.

        Your role is to analyze growth hypotheses, design validation metrics, and
        interpret data to support growth decisions.

        Responsibilities:
        1. ANALYZE MARKET DATA: Estimate market size (TAM/SAM/SOM), identify growth
        signals from public data, and assess market opportunity.

        2. DESIGN VALIDATION METRICS: Define North Star metrics, input metrics, and
        success criteria for growth experiments.

        3. INTERPRET EXPERIMENTS: Analyze A/B test results, cohort retention, and
        funnel metrics when user provides data.

        4. GROWTH RECOMMENDATIONS: Provide data-driven recommendations based on
        evidence, not assumptions.

        Run budget: use at most 4 web_search calls and 4 web_fetch calls for market
        data collection. Use last30days for social proof and public signals.

        Do not write final deliverable files. Return concise structured findings
        to the lead agent.

        Return structured findings including:
        - market size estimates (TAM/SAM/SOM) with methodology
        - North Star metric recommendation with justification
        - input metrics that drive the North Star
        - experiment design with success criteria
        - data analysis results (if user provided data)
        - growth recommendations with evidence labels

        Use these evidence types:
        - observed_public: from web search or last30days
        - estimated: reasoned estimate (must label as estimate)
        - user_provided: from user-uploaded data
        - unavailable: when data cannot be determined

        Do not invent exact market sizes, growth rates, or metrics without evidence.
        Label estimates clearly as estimates.

        '
      tools:
      - read_file
      - web_search
      - web_fetch
      - last30days
      skills:
      - ecom-launch
      - market-sizing
      - north-star-metric
      - ab-test-analysis
      - cohort-analysis
      model: inherit
      max_turns: 40
      timeout_seconds: 360
