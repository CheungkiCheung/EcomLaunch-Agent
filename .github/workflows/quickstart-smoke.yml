name: Quick Start and Docker Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "Makefile"
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "scripts/**"
      - "config.example.yaml"
      - ".env.example"
      - ".github/workflows/quickstart-smoke.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Makefile"
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "scripts/**"
      - "config.example.yaml"
      - ".env.example"
      - ".github/workflows/quickstart-smoke.yml"
  workflow_dispatch:

concurrency:
  group: quickstart-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quickstart-smoke:
    name: Local quick start (replay, no API key)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
      - name: Install nginx for the unified local prerequisite check
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Install application dependencies
        run: |
          cd backend && uv sync --group dev
          cd ../frontend && pnpm install --frozen-lockfile
      - name: Run documented dependency preflight
        run: make check
      - name: Start deterministic replay Gateway
        working-directory: backend
        run: |
          nohup uv run python scripts/run_replay_gateway.py \
            --profile opensku \
            --fixture tests/fixtures/replay/opensku_product_flows.json \
            --port 8114 \
            --cors http://127.0.0.1:3114 \
            > ../quickstart-gateway.log 2>&1 &
          echo $! > ../quickstart-gateway.pid
      - name: Wait for Gateway health
        run: ./scripts/wait-for-port.sh 8114 90 && curl --fail --retry 5 http://127.0.0.1:8114/health
      - name: Build and start the production frontend
        working-directory: frontend
        env:
          SKIP_ENV_VALIDATION: "1"
          BETTER_AUTH_SECRET: quickstart-smoke-local-secret
          DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://127.0.0.1:8114
        run: |
          pnpm build
          nohup pnpm start --port 3114 > ../quickstart-frontend.log 2>&1 &
          echo $! > ../quickstart-frontend.pid
      - name: Smoke public routes and the frontend-to-Gateway rewrite
        run: |
          ./scripts/wait-for-port.sh 3114 90
          curl --fail --retry 5 http://127.0.0.1:3114/
          curl --fail --retry 5 'http://127.0.0.1:3114/demo?scenario=growth&lang=zh'
          curl --fail --retry 5 http://127.0.0.1:3114/api/v1/auth/setup-status
      - name: Upload service logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: quickstart-smoke-logs
          path: |
            quickstart-gateway.log
            quickstart-frontend.log
          retention-days: 7
      - name: Stop local smoke services
        if: ${{ always() }}
        run: |
          test ! -f quickstart-frontend.pid || kill "$(cat quickstart-frontend.pid)" 2>/dev/null || true
          test ! -f quickstart-gateway.pid || kill "$(cat quickstart-gateway.pid)" 2>/dev/null || true

  docker-smoke:
    name: Production container build and boot
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Build production images
        run: |
          docker build -t opensku-backend-smoke -f backend/Dockerfile .
          docker build --target prod -t opensku-frontend-smoke -f frontend/Dockerfile .
      - name: Create isolated smoke network
        run: docker network create opensku-smoke
      - name: Boot replay Gateway from the production backend image
        run: |
          docker run -d --name opensku-backend-smoke \
            --network opensku-smoke \
            -v "$PWD/backend/tests:/app/backend/tests:ro" \
            -e AUTH_JWT_SECRET=opensku-docker-smoke-secret-32-bytes \
            opensku-backend-smoke \
            sh -c 'cd /app/backend && PYTHONPATH=.:tests uv run --no-sync python scripts/run_replay_gateway.py --host 0.0.0.0 --port 8001'
      - name: Wait for backend container health
        run: |
          for attempt in $(seq 1 60); do
            if docker run --rm --network opensku-smoke curlimages/curl:8.12.1 --fail http://opensku-backend-smoke:8001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs opensku-backend-smoke
          exit 1
      - name: Boot production frontend image
        run: |
          docker run -d --name opensku-frontend-smoke \
            --network opensku-smoke \
            -p 3115:3000 \
            -e BETTER_AUTH_SECRET=opensku-docker-smoke-local-secret \
            -e DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://opensku-backend-smoke:8001 \
            opensku-frontend-smoke
      - name: Smoke the containerized application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:3115/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3115/
          curl --fail 'http://127.0.0.1:3115/demo?scenario=launch&lang=en'
          curl --fail http://127.0.0.1:3115/api/v1/auth/setup-status
      - name: Collect container logs
        if: ${{ always() }}
        run: |
          mkdir -p docker-smoke-logs
          docker logs opensku-backend-smoke > docker-smoke-logs/backend.log 2>&1 || true
          docker logs opensku-frontend-smoke > docker-smoke-logs/frontend.log 2>&1 || true
      - name: Upload container logs
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: docker-smoke-logs
          path: docker-smoke-logs/
          retention-days: 7
      - name: Stop containers
        if: ${{ always() }}
        run: |
          docker rm -f opensku-frontend-smoke opensku-backend-smoke 2>/dev/null || true
          docker network rm opensku-smoke 2>/dev/null || true
