<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">OpenSKU social preview</title>
  <desc id="description">OpenSKU brand message beside the visual AI ecommerce war room.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f7ead6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6d4d35" flood-opacity=".22"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="556" y="54" width="674" height="532" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="75" cy="52" r="185" fill="#ff8a2b" opacity=".08"/>
  <circle cx="462" cy="622" r="190" fill="#ffb25f" opacity=".12"/>

  <g transform="translate(62 65)">
    <rect width="106" height="106" rx="28" fill="#fff" filter="url(#shadow)"/>
    <image href="opensku-logo.svg" x="9" y="9" width="88" height="88"/>
  </g>

  <text x="62" y="232" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="#33251f">OpenSKU</text>
  <text x="62" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#f36f21">THE OPEN-SOURCE AI LAUNCH TEAM</text>
  <text x="62" y="343" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="31" font-weight="600" fill="#51433b">Research the market.</text>
  <text x="62" y="386" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="31" font-weight="600" fill="#51433b">Make the decision.</text>
  <text x="62" y="429" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="31" font-weight="600" fill="#51433b">Build the launch pack.</text>

  <g transform="translate(62 495)">
    <rect width="126" height="46" rx="23" fill="#33251f"/>
    <text x="63" y="30" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fffaf1">Multi-Agent</text>
    <rect x="140" width="132" height="46" rx="23" fill="#f36f21"/>
    <text x="206" y="30" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff">Evidence-led</text>
    <rect x="286" width="126" height="46" rx="23" fill="#fff" stroke="#d8b98f" stroke-width="2"/>
    <text x="349" y="30" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#51433b">Self-hosted</text>
  </g>

  <rect x="542" y="40" width="702" height="560" rx="36" fill="#fff" filter="url(#shadow)"/>
  <image href="war-room-hero.png" x="556" y="54" width="674" height="532" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)"/>
  <rect x="556" y="54" width="674" height="532" rx="28" fill="none" stroke="#fff" stroke-width="4"/>
</svg>
